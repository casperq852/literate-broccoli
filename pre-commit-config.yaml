repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        exclude_types: [css, markdown, text, svg]
      - id: trailing-whitespace
        exclude_types: [html, markdown, text]
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: python
        exclude: (__pycache__/|Dockerfile|\.(toml|yaml|lock|md|gitignore|png|txt)$|\.detect\.baseline$|\.order$)
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: python
        exclude: (__pycache__/|Dockerfile|\.(toml|yaml|lock|md|gitignore|png|txt)$|\.detect\.baseline$|\.order$)
  - repo: local
    hooks:
      - id: codespell
        name: codespell
        entry: codespell
        language: python
        exclude: __pycache__/
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: ty check
        language: python
        pass_filenames: false
        exclude: (__pycache__/|Dockerfile|\.(toml|yaml|lock|md|gitignore|png|txt)$|\.detect\.baseline$|\.order$)
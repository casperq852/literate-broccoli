sections:
- id: samenvatting
  title_nl: 1. Samenvatting Investment Case
  title_en: 1. Investment Case Summary
  search_hint: investment thesis business model revenue growth strategy competitive position
  prompt_nl: 'Schrijf een beknopte maar krachtige samenvatting van de investment case voor {company}.

    Beschrijf: kernactiviteiten, business model, voornaamste waardedrijvers en waarom dit een aantrekkelijke belegging kan zijn. Wees concreet en gebruik cijfers waar beschikbaar.

    {direction}

    Maximaal {max_words} woorden.'
  prompt_en: 'Write a concise but compelling investment case summary for {company}.

    Cover: core activities, business model, key value drivers and why this is an attractive investment. Be specific and use numbers where available.

    {direction}

    Maximum {max_words} words.'
- id: track_record
  title_nl: 2. Historie / Track Record
  title_en: 2. History / Track Record
  search_hint: historical revenue earnings growth track record management execution milestones
  prompt_nl: 'Beschrijf de historische financiële prestaties en het management track record van {company}.

    Bespreek: omzet- en winstgroei, dividendhistorie, management wisselingen en hoe het bedrijf eerdere uitdagingen heeft overwonnen.

    {direction}

    Maximaal {max_words} woorden.'
  prompt_en: 'Describe the historical financial performance and management track record of {company}.

    Cover: revenue and earnings growth, dividend history, management changes and how the company has navigated past challenges.

    {direction}

    Maximum {max_words} words.'
- id: industrie
  title_nl: 3a. Industrie & Positie in de Value Chain
  title_en: 3a. Industry & Value Chain Position
  search_hint: industry structure competitive landscape market position value chain barriers entry pricing power
  prompt_nl: 'Analyseer de aantrekkelijkheid van de industrie en de positie van {company} in de value chain.

    Bespreek: marktstructuur, toetredingsbarrières, concurrentielandschap en de positie t.o.v. leveranciers en afnemers.

    {direction}

    Maximaal {max_words} woorden.'
  prompt_en: 'Analyse the industry attractiveness and {company}''s position in the value chain.

    Cover: market structure, barriers to entry, competitive landscape and the company''s position relative to suppliers and customers.

    {direction}

    Maximum {max_words} words.'
- id: moat
  title_nl: 3b. Competitive Moat & KPI's
  title_en: 3b. Competitive Moat & KPIs
  search_hint: competitive advantage moat brand pricing power switching costs market share returns on capital ROIC
  prompt_nl: 'Beoordeel de competitive moat van {company}.

    {moat_context}

    Onderbouw met meetbare bewijzen: ROIC vs. WACC, prijsstellingsvermogen, churn, marktaandeel. Geef 3-5 KPI''s om de moat te monitoren. Beschrijf ook de grenzen en zwakheden.

    {direction}

    Maximaal {max_words} woorden.'
  prompt_en: 'Assess the competitive moat of {company}.

    {moat_context}

    Support with measurable evidence: ROIC vs WACC, pricing power, churn, market share. Give 3-5 KPIs to monitor the moat. Also describe its limits and weaknesses.

    {direction}

    Maximum {max_words} words.'
- id: management
  title_nl: 3c. Management Kwaliteit
  title_en: 3c. Management Quality
  search_hint: management CEO CFO track record capital allocation governance strategy execution
  prompt_nl: 'Beoordeel de kwaliteit van het management van {company}.

    Bespreek: track record van CEO/CFO, kapitaalallocatiediscipline, governance en strategische executie. Geef concrete voorbeelden.

    {direction}

    Maximaal {max_words} woorden.'
  prompt_en: 'Assess the management quality of {company}.

    Cover: CEO/CFO track record, capital allocation discipline, governance and strategic execution. Give concrete examples.

    {direction}

    Maximum {max_words} words.'
- id: ingeprijsd
  title_nl: 4. Welke Verwachtingen zijn Ingeprijsd?
  title_en: 4. What Expectations Are Priced In?
  search_hint: valuation price target consensus estimates earnings expectations multiple peer comparison
  prompt_nl: 'Analyseer welke verwachtingen zijn ingeprijsd in de koers van {company}.

    Bespreek: waardering t.o.v. peers, impliciete groeiassumpties en consensusramingen.

    {direction}

    Maximaal {max_words} woorden.'
  prompt_en: 'Analyse what expectations are currently priced into {company}''s share price.

    Cover: valuation vs peers, implied growth assumptions and consensus estimates.

    {direction}

    Maximum {max_words} words.'
- id: veranderingen
  title_nl: 5. Veranderingen in Verwachtingen
  title_en: 5. Changes in Expectations We Anticipate
  search_hint: earnings revision upside catalyst growth surprise beat guidance change
  prompt_nl: 'Beschrijf op welke veranderingen in marktexpectaties wij anticiperen voor {company}.

    Noem de belangrijkste katalysatoren, het grootste opwaartse potentieel en wanneer dit zichtbaar wordt.

    {direction}

    Maximaal {max_words} woorden.'
  prompt_en: 'Describe what changes in market expectations we anticipate for {company}.

    Identify the key catalysts, the biggest upside potential and when this will materialise.

    {direction}

    Maximum {max_words} words.'
- id: risicos
  title_nl: 6. Risico's — Waar Kunnen We het Mis Hebben?
  title_en: 6. Risks — Where Can We Be Wrong?
  search_hint: risks downside regulatory competition disruption margin pressure earnings miss
  prompt_nl: 'Beschrijf de voornaamste risico''s van de investment case voor {company}.

    Groepeer per categorie: macro/sector, bedrijfsspecifiek, regulatoir, uitvoering, ESG. Wees eerlijk over de grootste beren en hoe groot de downside zou zijn.

    {direction}

    Maximaal {max_words} woorden.'
  prompt_en: 'Describe the main risks of the investment case for {company}.

    Group by category: macro/sector, company-specific, regulatory, execution, ESG. Be honest about the biggest bears and how large the downside could be.

    {direction}

    Maximum {max_words} words.'
- id: portefeuille
  title_nl: 7. Rol in de Portefeuille
  title_en: 7. Role in the Portfolio
  search_hint: portfolio role correlation sector exposure beta defensive cyclical diversification scenarios
  prompt_nl: 'Beschrijf de rol die {company} zou spelen in een gespreide aandelenportefeuille.

    Bespreek: sectorblootstelling, bèta, defensief vs. cyclisch karakter en hoe het bijdraagt aan diversificatie of concentratie in verschillende marktscenario''s.

    {direction}

    Maximaal {max_words} woorden.'
  prompt_en: 'Describe the role {company} would play in a diversified equity portfolio.

    Cover: sector exposure, beta, defensive vs cyclical nature and how it contributes to diversification or concentration risk across different market scenarios.

    {direction}

    Maximum {max_words} words.'
